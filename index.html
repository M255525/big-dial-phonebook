<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大字電話簿</title>
<meta name="description" content="給長輩用的大字電話簿：打開就看到家人的大照片，點一下就打電話。家人可以先整理好，用 LINE 傳連結給長輩一鍵加入。電話只存在手機裡。">
<meta name="theme-color" content="#7A1E1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --cover:#7A1E1E; --cover-2:#5E1414; --gold:#E3C26A; --gold-d:#B8963E;
  --paper:#FFF8E3; --paper-2:#FBEFC9; --rule:rgba(110,140,190,.22); --margin:rgba(205,70,70,.35);
  --ink:#2A1F14; --sub:#6A5A48; --card:#FFFFFF; --call:#1E8E3E; --call-d:#166C2F; --no:#8A8178; --red:#C62828;
  --fs:1; --mq:0px; color-scheme:light;
  --round:'Huninn','jf open 粉圓','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --hei:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;
}
html{font-size:calc(19px * var(--fs));-webkit-text-size-adjust:100%}
html[data-fs="xl"]{--fs:1.18}
html[data-fs="xxl"]{--fs:1.38}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--hei);font-weight:700;line-height:1.5;padding-top:var(--mq);
  background:#4A3426;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 13px)}
body.has-marquee{--mq:34px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#1A5FA8}
:focus-visible{outline:4px solid #FFB300;outline-offset:3px}
h1,h2,h3{margin:0;line-height:1.3;font-weight:900}

#marqueeBar{position:fixed;top:0;left:0;right:0;height:34px;background:#2B0A0A;z-index:60;overflow:hidden;display:none;align-items:center}
#marqueeBar.show{display:flex}
#marqueeTrack{display:inline-block;white-space:nowrap;padding-left:100%;font-size:15px;font-weight:700;color:#F6DD94;animation:marquee-scroll 30s linear infinite}
#marqueeBar:hover #marqueeTrack{animation-play-state:paused}
@keyframes marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#app{max-width:1060px;margin:0 auto;padding:14px 16px 28px}
/* 封面 */
.cover{background:var(--cover);border-radius:14px 14px 6px 6px;padding:14px 16px 16px;position:relative;color:var(--gold);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 5px);
  box-shadow:inset 0 0 0 3px var(--cover-2),inset 0 0 0 5px rgba(227,194,106,.45),0 6px 0 #3A1010}
.cover .row{display:flex;align-items:center;gap:.6rem}
.cover h1{flex:1 1 auto;font-family:var(--round);font-weight:400;font-size:2rem;letter-spacing:.35em;text-shadow:0 1px 0 #3A1010,0 0 1px var(--gold-d);display:flex;align-items:center;gap:.5rem;min-width:0}
.cover h1 .ic{font-size:1.6rem;letter-spacing:0}
.cbtn{background:rgba(0,0,0,.22);color:var(--gold);border:2px solid rgba(227,194,106,.55);border-radius:10px;min-height:3rem;padding:.2rem .7rem;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;gap:.25rem;font-size:.9rem}
.sos{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem}
.sos a{background:#fff;color:var(--red);border-radius:12px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:4rem;font-size:1.5rem;font-weight:900;box-shadow:0 4px 0 #3A1010;border:3px solid #F3C9C9}
.sos a small{font-size:.8rem;color:var(--ink);font-weight:700}
.sos a:active{transform:translateY(3px);box-shadow:0 1px 0 #3A1010}
.warn-line{margin:.55rem 0 0;font-size:.78rem;color:#F1D8B0;font-weight:500}
.warn-line button{background:none;border:0;padding:0;color:var(--gold);font-weight:900;text-decoration:underline;font-size:inherit}

/* 內頁 */
.book{position:relative;margin-top:-2px}
.page{background:var(--paper);border-radius:4px 4px 14px 14px;min-height:60vh;padding:14px 18px 22px 30px;position:relative;
  background-image:linear-gradient(90deg,transparent 18px,var(--margin) 18px,var(--margin) 20px,transparent 20px),repeating-linear-gradient(transparent 0 calc(2.2rem - 1px),var(--rule) calc(2.2rem - 1px) 2.2rem);
  box-shadow:0 6px 0 #D9C894,0 9px 0 #C4B07A,0 14px 22px rgba(0,0,0,.35)}
.tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin:0 0 .8rem}
.tab{border:0;border-radius:10px 10px 0 0;padding:.45rem .9rem .35rem;min-height:3rem;font-weight:900;font-size:1rem;color:#fff;opacity:.62;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.tab[aria-pressed="true"]{opacity:1;transform:translateY(-3px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.banner{background:#FFF0B3;border:2px dashed #C9A227;border-radius:10px;padding:.6rem .8rem;margin-bottom:.8rem;font-size:.9rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.banner b{flex:1 1 14rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13.5rem),1fr));gap:1rem}
.card{background:var(--card);border:0;border-radius:6px;padding:.7rem .7rem .8rem;text-align:left;position:relative;box-shadow:0 2px 0 #E5D9B6,0 6px 14px rgba(80,60,20,.18);display:flex;flex-direction:column;gap:.45rem;min-width:0}
.card::before,.card::after{content:'';position:absolute;top:-9px;width:54px;height:20px;background:rgba(233,214,150,.85);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card::before{left:12px;transform:rotate(-6deg)}.card::after{right:12px;transform:rotate(5deg)}
.card:active{transform:scale(.98)}
.av{width:100%;aspect-ratio:1/1;border-radius:4px;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--round);font-size:4.6rem;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.nm{font-size:1.55rem;font-weight:900;line-height:1.2;word-break:break-all}
.nm small{display:block;font-size:.85rem;color:var(--sub);font-weight:700}
.num{font-size:1.15rem;font-weight:900;letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums;word-break:break-all}
.dial{margin-top:auto;min-height:3.2rem;border-radius:12px;background:var(--call);color:#fff;display:flex;align-items:center;justify-content:center;gap:.4rem;box-shadow:0 3px 0 var(--call-d);font-size:1.15rem;font-weight:900}
.dial svg{width:1.5rem;height:1.5rem;fill:#fff;flex:none}
.card.emg .av{font-size:2.6rem;font-family:var(--hei);font-weight:900;aspect-ratio:auto;padding:1rem 0}
.card .say{font-size:.85rem;color:var(--sub);font-weight:700}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--sub)}
.empty b{display:block;font-size:1.3rem;color:var(--ink);margin-bottom:.4rem}

/* 撥號確認 */
#callView{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column;align-items:center;padding:calc(var(--mq) + 1rem) 16px 1.2rem;overflow:auto;
  background-image:repeating-linear-gradient(transparent 0 calc(2.2rem - 1px),var(--rule) calc(2.2rem - 1px) 2.2rem)}
.cv{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:.8rem;text-align:center}
.cv .av{width:min(62vw,15rem);border-radius:50%;border:6px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:6rem}
.cv h2{font-size:2rem}
.cv h2 .who{color:var(--cover)}
.cv .note{font-size:1rem;color:var(--sub)}
.go{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;min-height:5.2rem;border-radius:18px;background:var(--call);color:#fff;text-decoration:none;font-size:1.7rem;font-weight:900;box-shadow:0 6px 0 var(--call-d);border:0}
.go small{display:block;font-size:1rem;font-weight:700;opacity:.92}
.go svg{width:2.2rem;height:2.2rem;fill:#fff;flex:none}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--call-d)}
.nogo{width:100%;min-height:4rem;border-radius:16px;background:#E9E2D6;color:var(--ink);border:3px solid #CFC4B2;font-size:1.4rem;font-weight:900}
.sms{color:var(--ink);font-size:1rem;font-weight:900;min-height:3rem;display:inline-flex;align-items:center}
.pc{font-size:.85rem;color:var(--sub);font-weight:500;margin:0}

/* 按鈕與表單 */
.btn{border:0;border-radius:12px;background:var(--cover);color:#fff;font-weight:900;padding:.5rem 1rem;min-height:3.1rem;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-size:1rem}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink)}
.btn.green{background:var(--call)}
.btn.red{background:var(--red)}
.btn.sm{min-height:2.6rem;padding:.3rem .7rem;font-size:.9rem}
.stack{display:flex;flex-wrap:wrap;gap:.5rem}
.small{font-size:.82rem;color:var(--sub);font-weight:500;margin:0}
.fld{display:flex;flex-direction:column;gap:.25rem;font-size:.95rem}
.fld input,.fld select,.fld textarea{background:#fff;border:2px solid #CDBF9F;border-radius:10px;padding:.55rem .7rem;min-height:3rem;width:100%;font-weight:700}
.row2{display:grid;grid-template-columns:7rem 1fr;gap:.5rem}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35);pointer-events:none}
.hold.on .bar{width:100%;transition:width 2s linear}

/* 整理模式 */
.erow{display:flex;align-items:center;gap:.6rem;background:#fff;border-radius:10px;padding:.5rem .6rem;box-shadow:0 2px 0 #E5D9B6;margin-bottom:.5rem}
.erow .av{width:3.4rem;flex:none;font-size:1.6rem;border-radius:8px}
.erow .t{flex:1 1 0;min-width:0}
.erow .t b{display:block;font-size:1.1rem}
.erow .t span{font-size:.85rem;color:var(--sub)}
.erow .ib{width:2.8rem;height:2.8rem;border-radius:10px;border:2px solid #CDBF9F;background:#fff;font-size:1.05rem;flex:none}
.edit-head{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.8rem}
.edit-head h2{flex:1 1 100%;font-size:1.5rem}

.foot{margin-top:1.6rem;text-align:center;color:#F1D8B0;font-size:.85rem;font-weight:500}
.foot a{color:var(--gold);margin:0 .4rem;font-weight:700}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:#111;color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:90;font-weight:900;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#modal{position:fixed;inset:0;background:rgba(30,15,10,.6);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:calc(var(--mq) + 1.2rem) 16px 1.2rem;overflow:auto}
#modal.show{display:flex}
#modalBox{background:var(--paper);border-radius:14px;max-width:620px;width:100%;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.75rem;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#modalBox h2{font-size:1.4rem}
#modalBox ul{margin:0;padding-left:1.2rem;font-weight:500}#modalBox li{margin:.35rem 0}
.set-sec{border-radius:12px;margin-bottom:.5rem;background:#fff;box-shadow:0 0 0 2px #E5D9B6}
.set-sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;font-weight:900;min-height:3.2rem}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary::after{content:'▸';flex:none;transition:transform .2s}
.set-sec[open]>summary::after{transform:rotate(90deg)}
.set-sec .sst{flex:1 1 0;min-width:0}
.set-sec .ssv{font-weight:700;font-size:.8rem;color:var(--sub);text-align:right}
.set-body{padding:0 .8rem .8rem;display:flex;flex-direction:column;gap:.55rem}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{border:2.5px solid var(--ink);background:#fff;border-radius:10px;min-height:3rem;padding:.3rem .8rem;font-weight:900}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chk{display:flex;align-items:center;gap:.55rem;min-height:2.8rem;font-weight:700}
.chk input{width:1.4rem;height:1.4rem;flex:none}

/* 高對比 */
html[data-hc="1"]{--paper:#FFFFFF;--rule:transparent;--margin:transparent;--sub:#000;--ink:#000}
html[data-hc="1"] .card{box-shadow:0 0 0 3px #000}
html[data-hc="1"] .card::before,html[data-hc="1"] .card::after{display:none}
html[data-hc="1"] .tab{opacity:1;outline:3px solid #000}
html[data-hc="1"] .tab[aria-pressed="false"]{background:#fff!important;color:#000}

@media (max-width:560px){
  .cover h1{font-size:1.55rem;letter-spacing:.2em}
  .cbtn span{display:none}
  .page{padding:12px 12px 20px 26px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
  .nm{font-size:1.3rem}
  .num{font-size:1rem;letter-spacing:0}
  .card{padding:.55rem .55rem .65rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#marqueeTrack{animation:marquee-scroll 90s linear infinite!important}}

#printArea{display:none}
@page{size:A4 portrait;margin:10mm}
@media print{
  html{font-size:12pt}
  body{background:#fff!important;background-image:none!important;padding:0!important}
  #app,#marqueeBar,#modal,.toast,#callView{display:none!important}
  #printArea{display:block}
  .ppage{break-after:page;page-break-after:always}
  .ppage:last-child{break-after:auto;page-break-after:auto}
  .ph{font-size:20pt;font-weight:900;margin:0 0 4mm;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1mm solid #7A1E1E;padding-bottom:2mm}
  .ph small{font-size:10pt;font-weight:500}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:76mm;gap:4mm}
  .pc2{border:.6mm solid #333;border-radius:3mm;padding:4mm;display:flex;gap:4mm;align-items:center;break-inside:avoid}
  .pc2 .pav{width:30mm;height:30mm;border-radius:2mm;overflow:hidden;flex:none;display:grid;place-items:center;color:#fff;font-size:44pt;font-family:var(--round)}
  .pc2 .pav img{width:100%;height:100%;object-fit:cover}
  .pc2>div:last-child{min-width:0;flex:1 1 0}
  .pc2 b{display:block;font-size:24pt;line-height:1.15}
  .pc2 .pn{font-size:16pt;font-weight:900;margin-top:2mm;line-height:1.25;white-space:nowrap}
  .pc2 .pn span{display:block;font-size:10pt;font-weight:700}
  .pc2 .pn i{font-style:normal;font-size:12pt}
  .pc2 .pnote{font-size:11pt;font-weight:500;margin-top:1.5mm}
  .wgrid{display:grid;grid-template-columns:85.6mm 85.6mm;grid-auto-rows:54mm;gap:6mm}
  .wcard{border:.5mm dashed #666;border-radius:3mm;padding:3mm 4mm;font-size:12pt;line-height:1.3;overflow:hidden;break-inside:avoid}
  .wcard h3{font-size:13pt;margin:0 0 1mm;color:#7A1E1E}
  .wcard .wl{display:flex;justify-content:space-between;gap:2mm;font-weight:900;font-size:13pt;white-space:nowrap}
  .wcard .wl.big{font-size:15pt;color:#C62828}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="marqueeBar"><div id="marqueeTrack"></div></div>
<main id="app"></main>
<div id="callView" role="dialog" aria-modal="true" aria-labelledby="cvTitle" hidden></div>
<div id="printArea"></div>
<div id="modal" role="dialog" aria-modal="true"><div id="modalBox"></div></div>
<noscript>這個電話簿需要開啟 JavaScript。</noscript>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
